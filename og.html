<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Craftar — og.png source</title>
<!-- Source of /og.png. Render the .card element at 1200×630 (device scale 1) and save it as og.png. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=IBM+Plex+Sans:wght@400&display=swap">
<style>
  :root {
    --ink: #0A0E13; --plate: #11171F; --seam: #1C2733; --grid: #131A22;
    --text: #E7ECF1; --muted: #8A98A8; --ember: #E9915A;
    --mono: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, monospace;
    --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  }
  html, body { margin: 0; background: var(--ink); }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    padding: 72px 72px 0; color: var(--text); background-color: var(--ink);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 60px 60px; background-position: -1px -1px;
  }
  .brand { display: flex; align-items: center; gap: 22px; font-family: var(--mono); font-weight: 800; font-size: 36px; letter-spacing: -.01em; }
  .brand svg { width: 44px; height: 44px; }
  h1 { margin: 74px 0 0; font-family: var(--mono); font-weight: 700; font-size: 70px; line-height: 1.1; letter-spacing: -.02em; }
  p { margin: 34px 0 0; max-width: 760px; font-family: var(--body); font-size: 26px; line-height: 1.65; color: var(--muted); }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 68px; display: flex; align-items: center; justify-content: space-between; }
  .chips { display: flex; gap: 10px; }
  .chip { font-family: var(--mono); font-weight: 500; font-size: 22px; color: var(--muted); background: var(--plate); border: 1px solid var(--seam); border-radius: 4px; padding: 10px 16px; }
  .site { font-family: var(--mono); font-weight: 700; font-size: 26px; color: var(--ember); }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect x="2" y="14" width="10" height="10" rx="1.5" fill="#E9915A"/>
      <rect x="14" y="14" width="10" height="10" rx="1.5" fill="#7FB4D6"/>
      <rect x="8" y="2" width="10" height="10" rx="1.5" fill="#E7ECF1"/>
    </svg>
    Craftar
  </div>
  <h1>A build system for<br>AI-coding harnesses</h1>
  <p>Keep rules, agents, commands, skills, hooks and MCPs in one Forge in Git. Emit them natively into every workspace.</p>
  <div class="foot">
    <div class="chips">
      <span class="chip">.claude/</span>
      <span class="chip">.mcp.json</span>
      <span class="chip">.kiro/</span>
      <span class="chip">AGENTS.md</span>
    </div>
    <span class="site">craftar.dev</span>
  </div>
</div>
</body>
</html>
